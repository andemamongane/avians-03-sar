# The avians container next to a running aerial-autonomy-stack (Linux machine).
#   - joins AAS's simulation network, on the drone's ROS domain (Drone1 = 1)
#   - reaches AAS's simulation container through the docker socket (Gazebo
#     models, wind, recording, PX4 parameters)
#   - mounts the repo live: code edits need no rebuild
name: avians-03
services:
  avians:
    build: {context: .., dockerfile: docker/Dockerfile}
    image: avians-03:latest
    container_name: avians-03
    env_file: [{path: ../.env, required: false}]
    environment:
      ROS_DOMAIN_ID: "1"
      ROS_AUTOMATIC_DISCOVERY_RANGE: SUBNET
      AVIANS_ROOT: /workspace
    volumes:
      - ../packages:/workspace/packages
      - ../configs:/workspace/configs
      - ../missions:/workspace/missions
      - ../worlds:/workspace/worlds
      - ../data:/workspace/data
      - /var/run/docker.sock:/var/run/docker.sock
    working_dir: /workspace
    networks: [aas_sim]
    stdin_open: true
    tty: true
networks:
  aas_sim:
    name: aas-sim-network-inst0      # created by AAS's sim_run.sh (INSTANCE=0)
    external: true
