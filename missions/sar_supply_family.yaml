# The search-and-rescue benchmark: find a missing hiker, get them help and
# supplies, stay with them until help arrives.
name: sar_supply_family
world: worlds/sar_valley_family
envelope: standard
horizon_s: 1500
brief: >-
  A hiker is missing in the valley. Find them. As soon as you are sure it is
  them, report their position: that dispatches the rescue helicopter (about
  10 minutes out; a wrong position delays it). Pick up the medical kit at the
  base depot and drop it within 5 m of them. Then stay with them (within 30 m)
  until the helicopter arrives. Until they are found, keep every search
  region fresh: each one visited at least once every 10 minutes. The fire
  zone may close; get out within 30 s and stay out while it is closed. Keep at least 10 %
  battery: the charging pad is at base, the swap station is forward.
spec:
  dt: 0.5
  clauses:
    no_fly:       {formula: "G[0,1500] !in(nofly_power)", says: "never enter the power line corridor"}
    closed_zone:  {formula: "G[0,1500] ((H[0,30] unsafe_zone_fire) -> !in(zone_fire))", says: "once the fire zone has been closed for 30 s, never be in it"}
    battery:      {formula: "G[0,1500] battery >= 10", says: "keep at least 10 % battery"}
    clearance:    {formula: "G[0,1500] clearance >= 3", says: "stay 3 m or more from obstacles"}
    find:         {formula: "F[0,900] found", says: "find the person within 15 minutes"}
    patrol_r1:    {formula: "G[0,900] ((!O found) -> F[0,600] (in(r1) | found))", says: "until found, visit r1 at least every 10 minutes"}
    patrol_r2:    {formula: "G[0,900] ((!O found) -> F[0,600] (in(r2) | found))", says: "until found, visit r2 at least every 10 minutes"}
    patrol_r3:    {formula: "G[0,900] ((!O found) -> F[0,600] (in(r3) | found))", says: "until found, visit r3 at least every 10 minutes"}
    patrol_r4:    {formula: "G[0,900] ((!O found) -> F[0,600] (in(r4) | found))", says: "until found, visit r4 at least every 10 minutes"}
    report:       {formula: "G[0,1300] (found -> F[0,120] help_dispatched)", says: "report the person within 2 minutes of finding them"}
    deliver:      {formula: "F[0,1500] drop_err <= 5", says: "the kit lands within 5 m of the person"}
    stay:         {formula: "G[0,1500] (((O released) & !help) -> dist_person <= 30)", says: "after the drop, stay within 30 m of the person until help arrives"}
