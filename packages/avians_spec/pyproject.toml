[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "avians-spec"
version = "0.3.0"
description = "AVIANS mission specifications: STL with past-time operators, signal registry, ROSI online monitoring"
requires-python = ">=3.10"
dependencies = ["numpy"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"*" = ["*.yaml", "*.md", "*.txt"]
