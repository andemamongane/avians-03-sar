[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "avians-perception"
version = "0.3.0"
description = "AVIANS perception: simulated person detector, YOLO ground projection, person tracker"
requires-python = ">=3.10"
dependencies = ["numpy", "filterpy"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"*" = ["*.yaml", "*.md", "*.txt"]
