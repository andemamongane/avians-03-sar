[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "avians-viz"
version = "0.3.0"
description = "AVIANS replays: 2D sped-up videos, QGroundControl exports, Gazebo replays"
requires-python = ">=3.10"
dependencies = ["numpy", "matplotlib>=3.6", "pymavlink", "imageio-ffmpeg", "avians-env"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"*" = ["*.yaml", "*.md", "*.txt"]
