[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "avians-env"
version = "0.3.0"
description = "AVIANS world descriptions: regions, hazards, people, stations, dynamic timelines (Taylor)"
requires-python = ">=3.10"
dependencies = ["numpy", "shapely>=2", "pyyaml"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"*" = ["*.yaml", "*.md", "*.txt"]
